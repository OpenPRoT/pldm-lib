[package]
name = "pldm-lib"
version = "0.1.0"
authors = ["Caliptra contributors", "OpenPRoT contributors"]
edition = "2021"
license.workspace = true

[workspace]
members = [
    "pldm-common",
    "pldm-interface"
]

[workspace.package]
version = "0.1.0"
authors = ["Caliptra contributors", "OpenPRoT contributors"]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
pldm-common = { path = "pldm-common" }
pldm-interface = { path = "pldm-interface" }
bitfield = "0.14.0"
# CRC-8 for the DSP0248 transferCRC. Pinned to the version already locked by
# the OpenPRoT firmware tree so both resolve to one copy.
crc = { version = "3.4.0", default-features = false }
zerocopy = { version = "0.8.17", features = ["derive"] }

[dependencies]
pldm-common.workspace = true
pldm-interface.workspace = true
